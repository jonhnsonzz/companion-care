<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陪诊师端 - 陪诊守护</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }
        
        .header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { font-size: 1.8em; margin-bottom: 8px; }
        .header .subtitle { font-size: 0.95em; opacity: 0.9; }
        
        /* 登录区 */
        .login-section { max-width: 400px; margin: 60px auto; padding: 20px; }
        .login-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .login-card h2 { text-align: center; margin-bottom: 20px; color: #11998e; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.9em; color: #666; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 1em; }
        
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: 600; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        
        /* 工作台 */
        .workspace { display: none; }
        .stats-bar { display: flex; justify-content: space-around; padding: 20px; background: white; margin-bottom: 15px; border-radius: 12px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.8em; font-weight: 700; color: #11998e; }
        .stat-label { font-size: 0.8em; color: #888; margin-top: 4px; }
        
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .card h3 { font-size: 1em; color: #11998e; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        /* 任务卡片 */
        .task-card { background: #f9f9f9; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #11998e; }
        .task-card .patient { font-weight: 600; font-size: 1.1em; margin-bottom: 6px; }
        .task-card .info { font-size: 0.9em; color: #666; margin-bottom: 4px; }
        .task-card .time { display: inline-block; background: #11998e; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.8em; margin-right: 6px; }
        .task-card .type { display: inline-block; background: #f0f0f0; color: #666; padding: 2px 10px; border-radius: 20px; font-size: 0.8em; }
        
        /* 任务详情 */
        .task-detail { background: linear-gradient(135deg, #11998e11 0%, #38ef7d11 100%); padding: 16px; border-radius: 12px; margin-top: 12px; font-size: 0.9em; white-space: pre-line; border: 1px solid #11998e22; }
        
        /* 标签 */
        .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8em; margin-right: 6px; margin-bottom: 6px; }
        .tag-green { background: #e8f5e9; color: #388e3c; }
        .tag-blue { background: #e3f2fd; color: #1976d2; }
        .tag-orange { background: #fff3e0; color: #f57c00; }
        
        .empty { text-align: center; padding: 40px; color: #aaa; }
        .empty-icon { font-size: 2.5em; margin-bottom: 8px; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9em; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
        
        /* Profile */
        .profile-bar { background: white; padding: 15px 20px; display: flex; align-items: center; gap: 12px; margin-bottom: 15px; border-radius: 12px; }
        .profile-avatar { width: 50px; height: 50px; background: linear-gradient(135deg, #11998e, #38ef7d); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.3em; }
        .profile-info .name { font-weight: 600; }
        .profile-info .meta { font-size: 0.85em; color: #888; }
        .logout-btn { margin-left: auto; padding: 8px 16px; background: #f0f0f0; border-radius: 8px; font-size: 0.85em; cursor: pointer; border: none; }
        
        /* 历史 */
        .history-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .history-item:last-child { border-bottom: none; }
        .history-item .date { font-size: 0.8em; color: #888; }
        .history-item .service { font-size: 0.9em; }
        
        /* 评价标签选择 */
        .rating-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .rating-tag { padding: 5px 10px; border-radius: 20px; font-size: 0.8em; cursor: pointer; border: 1px solid #e0e0e0; }
        .rating-tag.selected { background: #11998e; color: white; border-color: #11998e; }
        
        .tab-bar { display: flex; background: white; border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 0.9em; border-bottom: 2px solid transparent; }
        .tab.active { border-bottom-color: #11998e; color: #11998e; font-weight: 600; }
        
        /* 医院技巧 */
        .tips-card { background: #fff3e0; border-radius: 10px; padding: 12px; margin-top: 10px; }
        .tips-card .title { font-weight: 600; color: #f57c00; margin-bottom: 6px; font-size: 0.9em; }
        .tips-card ul { font-size: 0.85em; color: #666; padding-left: 18px; }
    </style>
</head>
<body>

<!-- 头部 -->
<div class="header">
    <h1>🏥 陪诊师工作台</h1>
    <div class="subtitle">陪诊守护 - 让子女安心</div>
</div>

<!-- 登录 -->
<div class="login-section" id="loginSection">
    <div class="login-card">
        <h2>陪诊师登录</h2>
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" id="loginPhone" placeholder="请输入手机号" value="13800138001">
        </div>
        <button class="btn" onclick="login()">登录</button>
        <p style="text-align: center; margin-top: 12px; font-size: 0.85em; color: #888;">
            示例账号：13800138001 / 13800138002 / 13800138003
        </p>
    </div>
</div>

<!-- 工作台 -->
<div class="workspace" id="workspace">
    <!-- 个人信息 -->
    <div class="card" style="margin: 15px;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="profile-avatar" id="myAvatar">-</div>
            <div class="profile-info">
                <div class="name" id="myName">-</div>
                <div class="meta" id="myMeta">-</div>
            </div>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>
    
    <!-- 统计 -->
    <div class="stats-bar" style="margin: 0 15px;">
        <div class="stat-item">
            <div class="stat-value" id="statOrders">0</div>
            <div class="stat-label">累计订单</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statRating">5.0</div>
            <div class="stat-label">评分</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statExpert">-</div>
            <div class="stat-label">擅长领域</div>
        </div>
    </div>
    
    <!-- Tab切换 -->
    <div class="tab-bar" style="margin: 15px;">
        <div class="tab active" data-tab="new-orders" onclick="switchTab('new-orders')">新订单</div>
        <div class="tab" data-tab="my-tasks" onclick="switchTab('my-tasks')">我的任务</div>
        <div class="tab" data-tab="history" onclick="switchTab('history')">历史记录</div>
    </div>
    
    <!-- 新订单 -->
    <div class="card" id="newOrdersSection" style="margin: 0 15px;">
        <h3>📋 可接订单</h3>
        <div id="availableOrders">
            <div class="empty">
                <div class="empty-icon">📦</div>
                <p>暂无可接订单</p>
            </div>
        </div>
    </div>
    
    <!-- 我的任务 -->
    <div class="card" id="myTasksSection" style="margin: 0 15px; display: none;">
        <h3>📌 进行中的任务</h3>
        <div id="myTasks">
            <div class="empty">
                <div class="empty-icon">📋</div>
                <p>暂无进行中的任务</p>
            </div>
        </div>
    </div>
    
    <!-- 历史 -->
    <div class="card" id="historySection" style="margin: 0 15px; display: none;">
        <h3>📜 历史服务</h3>
        <div id="myHistory">
            <div class="empty">
                <div class="empty-icon">📜</div>
                <p>暂无历史记录</p>
            </div>
        </div>
    </div>
    
    <!-- 医院技巧 -->
    <div class="card" style="margin: 0 15px;">
        <h3>💡 医院攻略库</h3>
        <div id="hospitalTips">
            <div class="tips-card">
                <div class="title">华西医院</div>
                <ul>
                    <li>内分泌科在4楼，扶梯比电梯快</li>
                    <li>上午10点后专家号基本约满，建议提前1天</li>
                    <li>抽血在3楼，B超在2楼，先抽血再B超</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<!-- 任务详情弹窗 -->
<div id="taskModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; padding: 24px;">
        <h3 style="margin-bottom: 16px;">📋 任务详情</h3>
        <div id="taskModalContent"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn" onclick="acceptTask()" style="background: linear-gradient(135deg, #11998e, #38ef7d);">接单</button>
            <button class="btn" onclick="closeModal()" style="background: #f0f0f0; color: #666;">关闭</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let companion = null;
let currentTask = null;

async function login() {
    const phone = document.getElementById('loginPhone').value.trim();
    if (!phone) return;
    
    try {
        const res = await fetch('/api/companion/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
        });
        const data = await res.json();
        
        if (data.success) {
            companion = data.companion;
            localStorage.setItem('companion_id', companion.id);
            showWorkspace();
            loadCompanionData();
        } else {
            showToast('登录失败');
        }
    } catch (e) {
        showToast('网络错误');
    }
}

function logout() {
    companion = null;
    localStorage.removeItem('companion_id');
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('workspace').style.display = 'none';
}

function showWorkspace() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('workspace').style.display = 'block';
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    
    document.getElementById('newOrdersSection').style.display = tab === 'new-orders' ? 'block' : 'none';
    document.getElementById('myTasksSection').style.display = tab === 'my-tasks' ? 'block' : 'none';
    document.getElementById('historySection').style.display = tab === 'history' ? 'block' : 'none';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

async function loadCompanionData() {
    if (!companion) return;
    
    // 更新个人信息
    document.getElementById('myAvatar').textContent = companion.name[0];
    document.getElementById('myName').textContent = companion.name;
    document.getElementById('myMeta').textContent = `⭐ ${companion.rating} | ${companion.orders_count}单`;
    
    // 更新统计
    document.getElementById('statOrders').textContent = companion.orders_count || 0;
    document.getElementById('statRating').textContent = companion.rating?.toFixed(1) || '5.0';
    document.getElementById('statExpert').textContent = companion.expertise?.[0] || '-';
    
    // 加载订单
    const res = await fetch(`/api/companion/${companion.id}/orders`);
    const data = await res.json();
    
    const orders = data.orders || [];
    const available = orders.filter(o => o.status === 'matched');
    const inProgress = orders.filter(o => o.status === 'in_progress');
    const completed = orders.filter(o => o.status === 'completed');
    
    renderOrders(available, 'availableOrders');
    renderOrders(inProgress, 'myTasks');
    renderHistory(completed);
}

function renderOrders(orders, containerId) {
    const container = document.getElementById(containerId);
    
    if (orders.length === 0) {
        container.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><p>暂无订单</p></div>`;
        return;
    }
    
    container.innerHTML = orders.map(o => `
        <div class="task-card" onclick="showTaskDetail('${o.id}')">
            <div class="patient">👤 ${o.elderly_name}</div>
            <div class="info">🏥 ${o.hospital} ${o.department}</div>
            <div style="margin-top: 8px;">
                <span class="time">${o.appointment_date || '待确认'}</span>
                <span class="type">${o.service_type || '普通陪诊'}</span>
            </div>
            <div style="margin-top: 10px; font-size: 0.85em; color: #888;">
                💰 ¥${o.fee} | 匹配度 ⭐${(o.match_score || 5).toFixed(1)}
            </div>
        </div>
    `).join('');
}

function renderHistory(orders) {
    const container = document.getElementById('myHistory');
    
    if (orders.length === 0) {
        container.innerHTML = `<div class="empty"><div class="empty-icon">📜</div><p>暂无历史记录</p></div>`;
        return;
    }
    
    container.innerHTML = orders.map(o => `
        <div class="history-item">
            <div class="date">${o.completed_at?.slice(0, 10) || o.created_at?.slice(0, 10)}</div>
            <div class="service">${o.hospital} ${o.department} | ${o.elderly_name}</div>
            <div style="font-size: 0.85em; color: #888; margin-top: 4px;">
                ${o.services || '常规陪诊'} | ¥${o.fee}
            </div>
        </div>
    `).join('');
}

function showTaskDetail(orderId) {
    // 简化：直接从当前数据中查找
    // 真实场景需要调API
    showToast('请联系平台确认接单');
}

function closeModal() {
    document.getElementById('taskModal').style.display = 'none';
    currentTask = null;
}

// 页面加载时检查登录状态
document.addEventListener('DOMContentLoaded', () => {
    const savedId = localStorage.getItem('companion_id');
    if (savedId) {
        // 尝试恢复会话
        fetch(`/api/companion/${savedId}`)
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    companion = data.companion;
                    showWorkspace();
                    loadCompanionData();
                }
            })
            .catch(() => {});
    }
});
</script>

</body>
</html>
